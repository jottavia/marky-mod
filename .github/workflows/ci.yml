name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Repo health checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checks
        run: npm run check
